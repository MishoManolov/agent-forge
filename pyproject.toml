[project]
name = "agent-forge"
version = "0.1.0"
description = "Spin up persistent multi-agent Hermes teams in tmux, talking over Redis."
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "redis>=5.0",
  "mcp>=1.2,<2",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
]

[project.scripts]
forge = "forge.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "fakeredis>=2.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
